<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffé Pronto | Premium Coffee Experience</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
   <header>

    <!-- Logo -->
    <div class="logo">
        <h2>☕ Caffé Pronto</h2>
    </div>

    <!-- Navigation -->
    <nav>
        <a href="#hero">Home</a>
        <a href="#about">About</a>
        <a href="#menu">Menu</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Opening Hours -->
    <div class="header-actions">

    <button class="reserve-btn">
        Reserve Table
    </button>

    <div class="opening-hours">
        <p>🕒 Open Daily</p>
        <span>8:00 AM - 10:00 PM</span>
    </div>

</div>

</header>

    <main>
        <!-- Hero Section -->
        <section id="hero">
        </section>

        <!-- About Section -->
        <section id="about">
        </section>
        
         <!-- Menu Section -->
        <section id="menu">
        </section>
        
        <!-- Gallery Section -->
        <section id="gallery">
        </section>
         
         <!-- Testimonials Section -->
        <section id="testimonials">
        </section>
        
        <!-- Reservation Section -->
        <section id="reservation">
        </section>
        
        <!-- Contact Section -->
        <section id="contact">
        </section>

    </main>

    <footer>
        <!-- Footer -->
    </footer>

    <script src="script.js"></script>

</body>
</html>
